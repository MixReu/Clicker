services:
  - type: worker
    name: clicker-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python clicker_bot_render.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: MERCHANT_ID
        value: "128"
      - key: ADMIN_IDS
        value: "6743070898"
